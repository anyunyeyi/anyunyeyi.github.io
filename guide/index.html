      <div class="post-body">
          <p>欢迎来到安理工区块链生存指南！这里记录了核心专业课的硬核推导与复习资料。<br />
<br></p>
<div id="pdf-container">
    <p style="text-align:center; color: #888;">🚀 正在连接云端引擎，自动抓取最新硬核指南...</p>
</div>
<script>
// 魔法抓取脚本：自动从你的开源仓库读取最新 PDF 列表
fetch('https://api.github.com/repos/anyunyeyi/AUST-Blockchain-Survival-Guide/contents/PDFs')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('pdf-container');
    container.innerHTML = '';
    
    // 过滤出所有的 PDF 文件
    const pdfs = data.filter(file => file.name.endsWith('.pdf'));
    
    if(pdfs.length === 0) {
        container.innerHTML = '<p style="text-align:center;">目前还没有发布的指南。</p>';
        return;
    }

    // 循环为你所有的 PDF 生成沉浸式阅读器
    pdfs.forEach(pdf => {
      const name = pdf.name.replace('.pdf', '');
      // 这里的链接指向了你第二步开启的 GitHub Pages 官方直连地址
      const pdfUrl = `https://anyunyeyi.github.io/AUST-Blockchain-Survival-Guide/PDFs/${pdf.name}`;

      const html = `
        <div style="margin-bottom: 50px;">
          <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;">📖 ${name}</h3>
          <iframe src="${pdfUrl}" width="100%" height="800px" style="border: none; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);"></iframe>
          <p style="text-align: center; margin-top: 15px;">
            > 📥 **下载直达**：<a href="${pdfUrl}" target="_blank"><strong>${name} (带水印完整版)</strong></a>
          </p>
        </div>
      `;
      container.innerHTML += html;
    });
  })
  .catch(error => {
    document.getElementById('pdf-container').innerHTML = '<p>引擎连接超时，请直接前往 <a target="_blank" rel="noopener" href="https://github.com/anyunyeyi/AUST-Blockchain-Survival-Guide">GitHub 仓库</a> 阅读。</p>';
  });
</script>
